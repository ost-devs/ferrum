[package]
name = "ferrum-state"
version = "0.0.0"
description = "The editor state of Ferrum: a port of @codemirror/state 6.7.6"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# cm6's `@internal` members that the crate's tests and the fixture replayer read (D15). Off by default; the
# dev-dependency below turns it on for `cargo test`.
__test = []

[dependencies]
serde_json = "1"

[dev-dependencies]
ferrum-state = { path = ".", features = ["__test"] }
# the fixture replayer reads a fixture file through a Visitor, with keys in file order (docs/parity/ferrum-state/plan.md, "Reading a fixture file")
serde_core = "1"
